<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Darkfield Rig Geometry</title>
<meta name="description" content="Interactive geometry of a ring-light darkfield setup: when does the lens start seeing the LEDs directly, and when does the dish wall scatter into the shot.">
<style>
/* Full-bleed 3D view with a thin control rail on the left; the rig itself is the page. Lab-bench black with the darkfield cyan. */
:root{--bg:#0b1216;--panel:#121c22;--fg:#dfe9ec;--muted:#8aa0a8;--line:#213038;--accent:#2fd4d9;--warn:#e8a04f;--mono:ui-monospace,Menlo,monospace;--body:system-ui,sans-serif;color-scheme:dark}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#0b1216;--panel:#121c22;--fg:#dfe9ec;--muted:#8aa0a8;--line:#213038;--accent:#2fd4d9;--warn:#e8a04f;color-scheme:dark}}
:root[data-theme="light"]{--bg:#0b1216;--panel:#121c22;--fg:#dfe9ec;--muted:#8aa0a8;--line:#213038;--accent:#2fd4d9;--warn:#e8a04f;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.rail{position:fixed;top:env(safe-area-inset-top,0px);left:0;bottom:0;width:min(300px,86vw);background:color-mix(in srgb,var(--panel) 92%,transparent);border-right:1px solid var(--line);padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;overflow-y:auto;display:grid;gap:12px;align-content:start;backdrop-filter:blur(6px)}
h1{font-size:17px;margin:0;letter-spacing:.01em}
.sub{color:var(--muted);margin:0;font-size:13px}
.back{font-size:12px;color:var(--accent);text-decoration:none;letter-spacing:.06em;text-transform:uppercase}
label{display:grid;gap:3px;font-size:12px;color:var(--muted)}
label b{color:var(--fg);font-weight:500;font-family:var(--mono);font-size:12px;display:flex;justify-content:space-between}
input[type=range]{width:100%;accent-color:var(--accent)}
.stat{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:5px;padding:8px 10px;display:grid;gap:4px}
.stat span{display:flex;justify-content:space-between;gap:8px}
.stat em{font-style:normal;color:var(--muted)}
.ok{color:var(--accent)}.bad{color:var(--warn)}
.legend{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
button{background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:6px 10px;font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,.back:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toggle{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:max(12px,env(safe-area-inset-right,0px));z-index:3;display:none}
@media (max-width:640px){.rail{display:none}.rail.open{display:grid}.toggle{display:block}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button class="toggle" id="tg">controls</button>
<aside class="rail" id="rail">
  <a class="back" href="index.html">← microzoo</a>
  <h1>Darkfield ring geometry</h1>
  <p class="sub">Drag to orbit. The lens sees only the pale cone; the ring must light the dish from outside it.</p>
  <label><b>Ring inner diameter <span id="v_ring"></span></b><input type="range" id="ring" min="30" max="120" value="80"></label>
  <label><b>Ring height below dish <span id="v_rh"></span></b><input type="range" id="rh" min="5" max="60" value="25"></label>
  <label><b>Dish diameter <span id="v_dish"></span></b><input type="range" id="dish" min="30" max="100" value="60"></label>
  <label><b>Water depth <span id="v_wd"></span></b><input type="range" id="wd" min="1" max="10" value="3"></label>
  <label><b>Lens field of view <span id="v_fov"></span></b><input type="range" id="fov" min="4" max="40" value="12"></label>
  <label><b>Working distance <span id="v_wdist"></span></b><input type="range" id="wdist" min="20" max="120" value="60"></label>
  <div class="stat" id="stat"></div>
  <div class="legend">
    <div><i style="background:#2fd4d9"></i>ring LEDs and their light cone</div>
    <div><i style="background:#c9d4d8"></i>what the lens sees (acceptance cone)</div>
    <div><i style="background:#5ad08a"></i>scattered light that reaches the lens: the organism</div>
    <div><i style="background:#e8a04f"></i>dish wall inside the lit zone: scatter risk</div>
  </div>
  <button id="reset">Reset to 60 mm dish, 80 mm ring</button>
</aside>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.149.0/three.min.js"></script>
<script>
(function(){
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x0b1216);
const cam=new THREE.PerspectiveCamera(40,1,1,2000);
let theta=0.9,phi=1.05,dist=260,target=new THREE.Vector3(0,20,0);
function placeCam(){cam.position.set(target.x+dist*Math.sin(phi)*Math.cos(theta),target.y+dist*Math.cos(phi),target.z+dist*Math.sin(phi)*Math.sin(theta));cam.lookAt(target);}
scene.add(new THREE.AmbientLight(0xffffff,0.5));
const key=new THREE.DirectionalLight(0xffffff,0.8);key.position.set(80,140,60);scene.add(key);

const grid=new THREE.GridHelper(300,30,0x213038,0x182329);grid.position.y=-0.1;scene.add(grid);
const mat=(c,o=1,extra={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,transparent:o<1,opacity:o,roughness:.6,metalness:.1},extra));

const rig=new THREE.Group();scene.add(rig);
let parts=[];
function clear(){parts.forEach(p=>{rig.remove(p);p.geometry&&p.geometry.dispose();});parts=[];}
function add(m){rig.add(m);parts.push(m);return m;}

const P={ring:80,rh:25,dish:60,wd:3,fov:12,wdist:60};
const ids=Object.keys(P);
const fmt=v=>v+' mm';

function build(){
  clear();
  const R=P.ring/2, D=P.dish/2, H=P.rh, W=P.wd, F=P.fov/2, L=P.wdist;
  // dish: floor + wall
  add(new THREE.Mesh(new THREE.CylinderGeometry(D,D,1,64),mat(0xdde6ea,.25))).position.y=0.5;
  const wall=add(new THREE.Mesh(new THREE.CylinderGeometry(D,D,15,64,1,true),mat(0xdde6ea,.18,{side:THREE.DoubleSide})));wall.position.y=7.5;
  // water
  add(new THREE.Mesh(new THREE.CylinderGeometry(D-0.6,D-0.6,W,64),mat(0x3aa8c8,.35))).position.y=1+W/2;
  // ring light: torus of LEDs
  const torus=add(new THREE.Mesh(new THREE.TorusGeometry(R+4,3,12,72),mat(0x1a262c)));torus.rotation.x=Math.PI/2;torus.position.y=-H;
  const leds=add(new THREE.Mesh(new THREE.TorusGeometry(R+1.5,1.2,8,72),new THREE.MeshBasicMaterial({color:0x2fd4d9})));leds.rotation.x=Math.PI/2;leds.position.y=-H+1.5;
  // ring light cone, aimed inward at the sample plane
  const aim=Math.atan2(H+1+W/2, R);
  const coneGeo=new THREE.CylinderGeometry(0.1,R+1.5,H+1+W/2,72,1,true);
  const lcone=add(new THREE.Mesh(coneGeo,new THREE.MeshBasicMaterial({color:0x2fd4d9,transparent:true,opacity:.10,side:THREE.DoubleSide,depthWrite:false})));
  lcone.position.y=-H+(H+1+W/2)/2;
  // lens + acceptance cone, apex at lens, base at sample
  const lens=add(new THREE.Mesh(new THREE.CylinderGeometry(9,9,22,32),mat(0x1a262c,1,{metalness:.4,roughness:.3})));lens.position.y=1+W+L+11;
  const glass=add(new THREE.Mesh(new THREE.CylinderGeometry(7,7,1,32),new THREE.MeshBasicMaterial({color:0x5fb8c4})));glass.position.y=1+W+L;
  const acc=add(new THREE.Mesh(new THREE.CylinderGeometry(0.5,F,L,48,1,true),new THREE.MeshBasicMaterial({color:0xc9d4d8,transparent:true,opacity:.14,side:THREE.DoubleSide,depthWrite:false})));
  acc.position.y=1+W+L/2;
  // acceptance cone extended down to the ring plane, to test for direct light
  const F_ring=F*(L+W+1+H)/L;
  const accDown=add(new THREE.Mesh(new THREE.CylinderGeometry(F,F_ring,W+1+H,48,1,true),new THREE.MeshBasicMaterial({color:0xc9d4d8,transparent:true,opacity:.06,side:THREE.DoubleSide,depthWrite:false})));
  accDown.position.y=1+W-(W+1+H)/2;
  // field-of-view ring on the water surface
  const fovRing=add(new THREE.Mesh(new THREE.RingGeometry(F-0.4,F,48),new THREE.MeshBasicMaterial({color:0xc9d4d8,side:THREE.DoubleSide})));fovRing.rotation.x=-Math.PI/2;fovRing.position.y=1+W+0.05;
  // the organism, with a scatter ray to the lens and an illumination ray from the ring
  const org=add(new THREE.Mesh(new THREE.SphereGeometry(1.4,16,12),new THREE.MeshBasicMaterial({color:0x5ad08a})));org.scale.set(1.6,0.7,0.8);org.position.set(2,1+W/2,-1);
  add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([org.position.clone(),new THREE.Vector3(0,1+W+L,0)]),new THREE.LineBasicMaterial({color:0x5ad08a})));
  add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(R+1.5,-H+1.5,0),org.position.clone()]),new THREE.LineBasicMaterial({color:0x2fd4d9})));
  const directLight = R+1.5 < F_ring;   // ring LEDs inside the lens acceptance: brightfield
  const wallLit = D > R*0.85;           // wall close to or outside the ring: scatter
  if(wallLit){wall.material=mat(0xe8a04f,.35,{side:THREE.DoubleSide});}
  document.getElementById('stat').innerHTML=
   `<span><em>ring light angle</em><b>${(aim*180/Math.PI).toFixed(0)}°</b></span>`+
   `<span><em>lens acceptance at ring plane</em><b>${(2*F_ring).toFixed(0)} mm</b></span>`+
   `<span><em>direct light into lens</em><b class="${directLight?'bad':'ok'}">${directLight?'YES → brightfield':'no → darkfield'}</b></span>`+
   `<span><em>dish wall in lit zone</em><b class="${wallLit?'bad':'ok'}">${wallLit?'yes → tape the wall':'clear'}</b></span>`+
   `<span><em>rule</em><b>ring ID &gt; ${(2*F_ring).toFixed(0)} mm, dish &lt; ${(2*R*0.85).toFixed(0)} mm</b></span>`;
}
ids.forEach(id=>{const el=document.getElementById(id);const v=document.getElementById('v_'+id);
  const upd=()=>{P[id]=+el.value;v.textContent=fmt(P[id]);build();};el.addEventListener('input',upd);v.textContent=fmt(P[id]);});
document.getElementById('reset').onclick=()=>{Object.assign(P,{ring:80,rh:25,dish:60,wd:3,fov:12,wdist:60});ids.forEach(id=>{document.getElementById(id).value=P[id];document.getElementById('v_'+id).textContent=fmt(P[id]);});build();};
document.getElementById('tg').onclick=()=>document.getElementById('rail').classList.toggle('open');
build();

let drag=false,lx=0,ly=0;
canvas.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY});addEventListener('pointerup',()=>drag=false);
canvas.addEventListener('pointermove',e=>{if(!drag)return;theta+=(e.clientX-lx)*0.008;phi=Math.min(1.5,Math.max(0.15,phi-(e.clientY-ly)*0.008));lx=e.clientX;ly=e.clientY;});
canvas.addEventListener('wheel',e=>{dist=Math.min(600,Math.max(80,dist+e.deltaY*0.3));},{passive:true});
function resize(){renderer.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
(function loop(){requestAnimationFrame(loop);if(!drag&&!reduced)theta+=0.0015;placeCam();renderer.render(scene,cam);})();
})();
</script>
</body>
</html>
